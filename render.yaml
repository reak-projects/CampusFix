services:
  # 1. Express REST API Web Service
  - type: web
    name: campusfix-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set this to your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: campusfix-web
          property: host

  # 2. React Vite Frontend Static Site
  - type: web
    name: campusfix-web
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: campusfix-api
          property: host
          value: https://campusfix-api.onrender.com/api
